<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debounce</title>
    <style>
      div {
        height: 100px;
        line-height: 100px;
        background-color: slategrey;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="d1"></div>
    <script>
      // 实现 2
      function debounce2(fn, wait = 50) {
        let timer = null
        return function () {
          const args = arguments
          if (timer) clearTimeout(timer)
          if (!timer) fn.call(this, ...args)
          timer = setTimeout(() => {
            timer = null
          }, wait)
        }
      }

      let d1 = document.getElementById('d1')

      let count = 1
      function fn() {
        d1.innerHTML = count++
      }

      d1.onmousemove = debounce2(fn, 1000)
    </script>
  </body>
</html>
