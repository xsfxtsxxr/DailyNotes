      .parent {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      .child {
        width: 100px;
        height: 100px;
        background-color: #ccaafc;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }
    </style>

    <div class="parent">
      <div class="child"></div>
    </div>
